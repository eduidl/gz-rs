[workspace]
members = ["crates/*", "examples"]
resolver = "2"

[workspace.package]
version = "0.10.0"
authors = ["Yume Hiramatsu <yuma.hiramatsu@gmail.com>"]
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/eduidl/gz-rs"
license = "Apache-2.0"
include = ["/src/**", "/tests/**", "/build.rs", "/Cargo.toml", "/README.md"]

[workspace.dependencies]
gz = { path = "./crates/gz", version = "=0.10.0" }
gz-build = { path = "./crates/gz-build", version = "=0.10.0" }
gz-msgs = { path = "./crates/gz-msgs", version = "=0.10.0" }
gz-msgs-build = { path = "./crates/gz-msgs-build", version = "=0.10.0" }
gz-msgs-common = { path = "./crates/gz-msgs-common", version = "=0.10.0" }
gz-msgs-derive = { path = "./crates/gz-msgs-derive", version = "=0.10.0" }
gz-transport = { path = "./crates/gz-transport", version = "=0.10.0" }
gz-transport-sys = { path = "./crates/gz-transport-sys", version = "=0.10.0" }
protobuf = "=3.7.2"
protobuf-codegen = "=3.7.2"

[workspace.metadata.release]
allow-branch = ["main"]
shared-version = true
tag-prefix = ""
